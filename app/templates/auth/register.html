{% extends "base.html" %}

{% block title %}Register · Freshup{% endblock %}

{% block content %}
<div class="card">
  <h1>Create an account</h1>
  <form method="post" action="{{ url_for('auth.register') }}" novalidate>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email">

    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="new-password" aria-describedby="password-rules">
    <p id="password-rules">At least {{ config.PASSWORD_MIN_LENGTH }} characters, with at least one letter and one number.</p>

    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" required autocomplete="new-password">

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
{% endblock %}
